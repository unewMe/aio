services:
  # 1. DEDICATED MACHINE LEARNING MICROSERVICE (PyTorch Inference & Reports)
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: casting_ml_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./ml/models_weights:/app/models_weights:ro
      - ./ml/reports:/app/reports:ro
      - ./ml/data:/app/data:ro
      - ./ml/casting_data:/app/casting_data:ro
      - ./ml/src:/app/src:ro
      - ./ml/server.py:/app/server.py:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. FASTAPI BACKEND (Netflix Dispatch DDD Architecture)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casting_backend_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      ml:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - ML_SERVICE_URL=http://ml:8001
      - DATABASE_URL=sqlite:////app/db/inspection_history.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend/app:/app/app:ro
      - backend_db:/app/db
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. NEXT.JS FRONTEND (Industrial AOI Dashboard)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casting_frontend_ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000/api/v1
      - INTERNAL_BACKEND_URL=http://backend:8000

volumes:
  backend_db:
    name: casting_backend_db
  backend_uploads:
    name: casting_backend_uploads
